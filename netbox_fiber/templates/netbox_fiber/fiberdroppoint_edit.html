{% extends 'generic/object_edit.html' %}

{% block content %}
{{ block.super }}

<style>
  .core-selector-card {
    background: var(--bs-body-bg, #ffffff);
    border: 1px solid var(--bs-border-color, #dee2e6);
    border-radius: 8px;
    padding: 16px;
    margin-top: 10px;
    margin-bottom: 20px;
  }
  .ts-wrapper .ts-control {
    border-radius: 6px;
    padding: 6px 10px;
    min-height: 42px;
  }
  .ts-wrapper.multi .ts-control > div {
    border-radius: 4px;
    font-weight: 500;
  }
  .ts-dropdown .option.disabled {
    opacity: 0.55;
    background: var(--bs-tertiary-bg, #f8f9fa);
    cursor: not-allowed;
    text-decoration: line-through;
  }
  .core-status-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  initCoreMultiSelect();
});
document.addEventListener('htmx:load', function() {
  initCoreMultiSelect();
});

function initCoreMultiSelect() {
  const droppedInput = document.getElementById('id_dropped_cores');
  const passedInput = document.getElementById('id_passed_cores');
  const routeSelect = document.getElementById('id_fiber_route');
  const pointTypeSelect = document.getElementById('id_point_type');
  if (!droppedInput || !routeSelect) return;

  // Prevent duplicate initialization
  if (document.getElementById('core-multiselect-widget')) return;

  // Create UI Container for Multi-Selects
  const widgetBox = document.createElement('div');
  widgetBox.id = 'core-multiselect-widget';
  widgetBox.className = 'core-selector-card shadow-sm';

  widgetBox.innerHTML = `
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 pb-2 border-bottom">
      <div>
        <h6 class="mb-0 fw-bold text-primary">
          <i class="mdi mdi-vector-polyline me-1"></i>Fiber Core Allocation (Tag Multi-Select)
        </h6>
        <small class="text-muted" id="core-multiselect-hint">
          Select cores dropped/terminated at this station and cores passing through to downstream points.
        </small>
      </div>
      <div class="btn-group btn-group-sm" role="group">
        <button type="button" class="btn btn-outline-primary" id="btn-auto-pass" title="Automatically calculate passed cores">
          <i class="mdi mdi-auto-fix me-1"></i>Auto Calculate Pass
        </button>
        <button type="button" class="btn btn-outline-secondary" id="btn-reset-cores" title="Reset selections">
          <i class="mdi mdi-refresh me-1"></i>Reset
        </button>
      </div>
    </div>

    <!-- Dropped Cores Multi-Select -->
    <div class="mb-3">
      <label class="form-label fw-bold d-flex justify-content-between align-items-center mb-1">
        <span>
          <span class="badge bg-success text-white me-1"><i class="mdi mdi-source-branch me-1"></i>Dropped Cores</span>
          Cores spliced / terminated locally at this location
        </span>
        <span class="small text-muted" id="drop-count-label">0 selected</span>
      </label>
      <select id="select_dropped_cores" multiple class="form-select" placeholder="Choose cores to drop..."></select>
      <div class="form-text text-muted small mt-1">
        <i class="mdi mdi-information-outline me-1"></i>Cores with both ends terminated are locked and disabled.
      </div>
    </div>

    <!-- Passed Cores Multi-Select -->
    <div class="mb-2">
      <label class="form-label fw-bold d-flex justify-content-between align-items-center mb-1">
        <span>
          <span class="badge bg-primary text-white me-1"><i class="mdi mdi-ray-start-end me-1"></i>Passed-Through Cores</span>
          Cores continuing along the cable through the closure without termination
        </span>
        <span class="small text-muted" id="pass-count-label">0 selected</span>
      </label>
      <select id="select_passed_cores" multiple class="form-select" placeholder="Choose cores to pass through..."></select>
      <div class="form-text text-muted small mt-1" id="pass-help-text">
        <i class="mdi mdi-information-outline me-1"></i>Cores dropped locally or terminated upstream cannot pass through.
      </div>
    </div>
  `;

  // Insert widget right above id_dropped_cores form group / parent
  const inputRow = droppedInput.closest('.form-group, .mb-3, .row, tr') || droppedInput.parentElement;
  if (inputRow && inputRow.parentElement) {
    inputRow.parentElement.insertBefore(widgetBox, inputRow);
  } else {
    droppedInput.insertAdjacentElement('beforebegin', widgetBox);
  }

  // Determine current Drop Point ID (if editing existing)
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  let currentDpId = null;
  const editIdx = pathParts.indexOf('edit');
  if (editIdx > 0 && !isNaN(pathParts[editIdx - 1])) {
    currentDpId = pathParts[editIdx - 1];
  }

  // TomSelect instances
  let tsDrop = null;
  let tsPass = null;
  let coresData = []; // list of { core, drop_count, is_locked, lock_reason }
  let totalCores = 0;

  // Helper to parse strings like "1, 2, 3-5" into array of numbers
  function parseCoreNumbers(str) {
    if (!str) return [];
    const res = [];
    const parts = String(str).replace(/;/g, ',').split(',');
    parts.forEach(p => {
      p = p.trim();
      if (!p) return;
      if (p.includes('-')) {
        const sub = p.split('-').map(x => parseInt(x.trim(), 10));
        if (sub.length === 2 && !isNaN(sub[0]) && !isNaN(sub[1])) {
          const start = Math.min(sub[0], sub[1]);
          const end = Math.max(sub[0], sub[1]);
          for (let i = start; i <= end; i++) {
            if (!res.includes(i)) res.push(i);
          }
        }
      } else {
        const num = parseInt(p, 10);
        if (!isNaN(num) && !res.includes(num)) res.push(num);
      }
    });
    return res.sort((a, b) => a - b);
  }

  // Sync from Multi-Selects to the hidden/text Form inputs
  function syncToInputs() {
    let dropVals = [];
    let passVals = [];

    if (tsDrop) {
      dropVals = tsDrop.getValue().map(v => parseInt(v, 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
    } else {
      const el = document.getElementById('select_dropped_cores');
      dropVals = Array.from(el.selectedOptions).map(o => parseInt(o.value, 10)).sort((a, b) => a - b);
    }

    if (tsPass) {
      passVals = tsPass.getValue().map(v => parseInt(v, 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
    } else if (document.getElementById('select_passed_cores')) {
      const el = document.getElementById('select_passed_cores');
      passVals = Array.from(el.selectedOptions).map(o => parseInt(o.value, 10)).sort((a, b) => a - b);
    }

    droppedInput.value = dropVals.join(', ');
    if (passedInput) {
      passedInput.value = passVals.join(', ');
    }

    const dropCountLabel = document.getElementById('drop-count-label');
    if (dropCountLabel) dropCountLabel.textContent = `${dropVals.length} core(s) selected`;

    const passCountLabel = document.getElementById('pass-count-label');
    if (passCountLabel) passCountLabel.textContent = `${passVals.length} core(s) selected`;
  }

  // Smart Auto-Calculation of Passed Cores based on Dropped Cores
  function calculatePassedCores() {
    if (!totalCores) return;
    const pointType = pointTypeSelect ? pointTypeSelect.value : 'drop';

    let dropVals = [];
    if (tsDrop) {
      dropVals = tsDrop.getValue().map(v => parseInt(v, 10)).filter(n => !isNaN(n));
    } else {
      dropVals = parseCoreNumbers(droppedInput.value);
    }

    if (pointType === 'start') {
      // Starting Point: All cores enter cable
      const allCores = Array.from({ length: totalCores }, (_, i) => String(i + 1));
      if (tsDrop && !tsDrop.getValue().length) tsDrop.setValue(allCores);
      if (tsPass) tsPass.setValue(allCores);
    } else if (pointType === 'end') {
      // End Point: Terminates route, no cores pass through
      if (tsPass) {
        tsPass.clear();
        tsPass.disable();
      }
      // Drop all available remaining cores
      const available = coresData.filter(cd => !cd.is_locked).map(cd => String(cd.core));
      if (tsDrop && !tsDrop.getValue().length) {
        tsDrop.setValue(available);
      }
    } else {
      // Intermediate Drop Point:
      // Passed Cores = Cores not locked elsewhere and not dropped here
      if (tsPass) {
        tsPass.enable();
        const passedToSelect = [];
        coresData.forEach(cd => {
          if (!cd.is_locked && !dropVals.includes(cd.core)) {
            passedToSelect.push(String(cd.core));
          }
        });
        tsPass.setValue(passedToSelect);
      }
    }

    syncToInputs();
  }

  // Populate Options in TomSelect
  function populateSelectOptions(routeData) {
    coresData = routeData.cores_info || [];
    totalCores = routeData.total_cores || 0;
    const pointType = pointTypeSelect ? pointTypeSelect.value : 'drop';

    const dropEl = document.getElementById('select_dropped_cores');
    const passEl = document.getElementById('select_passed_cores');
    if (!dropEl || !passEl) return;

    // Destroy existing TomSelect instances if any
    if (tsDrop) { tsDrop.destroy(); tsDrop = null; }
    if (tsPass) { tsPass.destroy(); tsPass = null; }

    dropEl.innerHTML = '';
    passEl.innerHTML = '';

    const initialDropped = parseCoreNumbers(droppedInput.value || (routeData.current_dropped || []).join(','));
    const initialPassed = parseCoreNumbers(passedInput ? passedInput.value || (routeData.current_passed || []).join(',') : '');

    coresData.forEach(cd => {
      const c = cd.core;
      const isLocked = cd.is_locked; // Both ends dropped

      // Drop option
      const dropOpt = document.createElement('option');
      dropOpt.value = c;
      if (isLocked) {
        dropOpt.disabled = true;
        dropOpt.textContent = `Core ${c} [DISABLED - ${cd.lock_reason}]`;
      } else {
        dropOpt.textContent = `Core ${c}`;
        if (initialDropped.includes(c)) dropOpt.selected = true;
      }
      dropEl.appendChild(dropOpt);

      // Pass option
      const passOpt = document.createElement('option');
      passOpt.value = c;
      if (pointType === 'end') {
        passOpt.disabled = true;
        passOpt.textContent = `Core ${c} [End Point - No outgoing cores]`;
      } else if (isLocked) {
        passOpt.disabled = true;
        passOpt.textContent = `Core ${c} [DISABLED - ${cd.lock_reason}]`;
      } else {
        passOpt.textContent = `Core ${c}`;
        if (initialPassed.includes(c)) passOpt.selected = true;
      }
      passEl.appendChild(passOpt);
    });

    // Initialize TomSelect if library is available
    if (typeof TomSelect !== 'undefined') {
      try {
        tsDrop = new TomSelect(dropEl, {
          plugins: ['remove_button', 'clear_button'],
          persist: false,
          create: false,
          maxItems: null,
          placeholder: 'Search and select cores to drop...',
          hideSelected: true,
          closeAfterSelect: false,
          onItemAdd: function() {
            syncToInputs();
            if (pointType === 'drop') calculatePassedCores();
          },
          onItemRemove: function() {
            syncToInputs();
            if (pointType === 'drop') calculatePassedCores();
          },
          onChange: function() {
            syncToInputs();
          }
        });

        tsPass = new TomSelect(passEl, {
          plugins: ['remove_button', 'clear_button'],
          persist: false,
          create: false,
          maxItems: null,
          placeholder: pointType === 'end' ? 'End point terminates route (no passed cores)' : 'Search and select cores to pass through...',
          hideSelected: true,
          closeAfterSelect: false,
          onChange: function() {
            syncToInputs();
          }
        });

        if (pointType === 'end') {
          tsPass.disable();
        }
      } catch (err) {
        console.warn("TomSelect init fallback:", err);
      }
    } else {
      // Native multi-select fallback
      dropEl.addEventListener('change', syncToInputs);
      passEl.addEventListener('change', syncToInputs);
    }

    // If new point and inputs were blank, auto-calculate initial pass
    if (!droppedInput.value && (!passedInput || !passedInput.value)) {
      calculatePassedCores();
    } else {
      syncToInputs();
    }
  }

  // Fetch Route Data via API
  function loadRouteData(routeId) {
    if (!routeId) return;

    let url = `/plugins/fiber/api/route-cores/?route_id=${encodeURIComponent(routeId)}`;
    if (currentDpId) {
      url += `&drop_point_id=${encodeURIComponent(currentDpId)}`;
    }

    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(data => {
        populateSelectOptions(data);
      })
      .catch(err => {
        console.error("Error loading route cores:", err);
      });
  }

  // Button Listeners
  document.getElementById('btn-auto-pass').addEventListener('click', function(e) {
    e.preventDefault();
    calculatePassedCores();
  });

  document.getElementById('btn-reset-cores').addEventListener('click', function(e) {
    e.preventDefault();
    if (tsDrop) tsDrop.clear();
    if (tsPass) tsPass.clear();
    droppedInput.value = '';
    if (passedInput) passedInput.value = '';
    syncToInputs();
  });

  // Route select listener
  routeSelect.addEventListener('change', function() {
    loadRouteData(this.value);
  });

  // Point type select listener
  if (pointTypeSelect) {
    pointTypeSelect.addEventListener('change', function() {
      const hint = document.getElementById('core-multiselect-hint');
      const passHelp = document.getElementById('pass-help-text');
      if (this.value === 'start') {
        if (hint) hint.textContent = 'Starting Point: All route cores originate here and enter the cable.';
        if (passHelp) passHelp.textContent = 'All originating cores typically pass into the outgoing cable bundle.';
        if (tsPass) tsPass.enable();
      } else if (this.value === 'end') {
        if (hint) hint.textContent = 'End Point: Destination station where remaining cores terminate. No cores pass through beyond this station.';
        if (passHelp) passHelp.textContent = 'End Point: No cores pass beyond the termination of the route.';
        if (tsPass) {
          tsPass.clear();
          tsPass.disable();
        }
      } else {
        if (hint) hint.textContent = 'Intermediate Drop Point: Cores are tapped/spliced into the local enclosure; remaining cores pass through.';
        if (passHelp) passHelp.textContent = 'Cores dropped locally or terminated upstream cannot pass through.';
        if (tsPass) tsPass.enable();
      }
      calculatePassedCores();
    });
  }

  // Initial Load
  if (routeSelect.value) {
    loadRouteData(routeSelect.value);
  } else {
    const urlParams = new URLSearchParams(window.location.search);
    const preRoute = urlParams.get('fiber_route');
    if (preRoute) {
      routeSelect.value = preRoute;
      loadRouteData(preRoute);
    }
  }
}
</script>
{% endblock %}
