{% extends 'base/layout.html' %}

{% block title %}Topology View - NetBox Fiber{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card p-5 border-0 shadow-sm mx-auto" style="max-width: 600px;">
    <i class="mdi mdi-information-outline fs-1 text-primary mb-3"></i>
    <h4 class="fw-bold">Topology View Removed</h4>
    <p class="text-muted">

    </p>
    <div>
      <a href="{% url 'plugins:netbox_fiber:fiberroute_list' %}" class="btn btn-primary">
        <i class="mdi mdi-arrow-left me-1"></i>Go to Fiber Routes

    </div>
  </div>
</div>
{% endblock %}
