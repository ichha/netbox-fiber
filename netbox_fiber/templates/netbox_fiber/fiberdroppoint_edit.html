{% extends 'generic/object_edit.html' %}

{% block content %}
{{ block.super }}

<style>
  /* Standard NetBox TomSelect styling for Core Selectors */
  .ts-wrapper .ts-control {
    border-radius: var(--bs-border-radius, 0.375rem);
    min-height: 38px;
    padding: 4px 8px;
  }
  .ts-wrapper.multi .ts-control > div {
    border-radius: 4px;
    font-weight: 500;
  }
  .ts-dropdown .option.disabled {
    opacity: 0.55 !important;
    background-color: var(--bs-tertiary-bg, #f8f9fa) !important;
    cursor: not-allowed !important;
    pointer-events: none !important;
    text-decoration: line-through;
    color: var(--bs-secondary-color, #6c757d) !important;
  }
  .core-pill-badge {
    font-size: 11px;
    font-weight: 600;
    margin-left: 6px;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  initCoreMultiSelect();
});
document.addEventListener('htmx:load', function() {
  initCoreMultiSelect();
});

function initCoreMultiSelect() {
  const droppedInput = document.getElementById('id_dropped_cores');
  const passedInput = document.getElementById('id_passed_cores');
  const routeSelect = document.getElementById('id_fiber_route');
  const pointTypeSelect = document.getElementById('id_point_type');

  if (!droppedInput || !routeSelect) return;

  // Prevent duplicate initialization
  if (document.getElementById('select_dropped_cores')) return;

  // 1. Hide the original text inputs but keep them in the DOM to submit form values
  droppedInput.style.display = 'none';
  if (passedInput) passedInput.style.display = 'none';

  // 2. Create the Dropped Cores native-style TomSelect element
  const dropSelect = document.createElement('select');
  dropSelect.id = 'select_dropped_cores';
  dropSelect.multiple = true;
  dropSelect.className = 'form-select';
  dropSelect.placeholder = 'Select cores to drop...';
  droppedInput.insertAdjacentElement('afterend', dropSelect);

  // 3. Create the Passed Cores native-style TomSelect element
  let passSelect = null;
  let passHelperBox = null;
  if (passedInput) {
    passSelect = document.createElement('select');
    passSelect.id = 'select_passed_cores';
    passSelect.multiple = true;
    passSelect.className = 'form-select';
    passSelect.placeholder = 'Select cores to pass through...';
    passedInput.insertAdjacentElement('afterend', passSelect);

    // Add helper link below Passed Cores
    passHelperBox = document.createElement('div');
    passHelperBox.className = 'd-flex justify-content-between align-items-center mt-1';
    passHelperBox.innerHTML = `
      <small class="text-muted" id="pass-status-text">
        <i class="mdi mdi-information-outline me-1"></i>Cores dropped locally or terminated upstream cannot pass through.
      </small>
      <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" id="btn-auto-pass" style="font-size: 12px;">
        <i class="mdi mdi-auto-fix me-1"></i>Auto-fill Passed Cores
      </button>
    `;
    passSelect.insertAdjacentElement('afterend', passHelperBox);
  }

  // Determine current Drop Point ID (if editing existing)
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  let currentDpId = null;
  const editIdx = pathParts.indexOf('edit');
  if (editIdx > 0 && !isNaN(pathParts[editIdx - 1])) {
    currentDpId = pathParts[editIdx - 1];
  }

  let tsDrop = null;
  let tsPass = null;
  let coresData = []; // list of { core, is_locked, lock_reason, terminated_at }
  let totalCores = 0;

  // Helper to parse strings like "1, 2, 3-5" into array of numbers
  function parseCoreNumbers(str) {
    if (!str) return [];
    const res = [];
    const parts = String(str).replace(/;/g, ',').split(',');
    parts.forEach(p => {
      p = p.trim();
      if (!p) return;
      if (p.includes('-')) {
        const sub = p.split('-').map(x => parseInt(x.trim(), 10));
        if (sub.length === 2 && !isNaN(sub[0]) && !isNaN(sub[1])) {
          const start = Math.min(sub[0], sub[1]);
          const end = Math.max(sub[0], sub[1]);
          for (let i = start; i <= end; i++) {
            if (!res.includes(i)) res.push(i);
          }
        }
      } else {
        const num = parseInt(p, 10);
        if (!isNaN(num) && !res.includes(num)) res.push(num);
      }
    });
    return res.sort((a, b) => a - b);
  }

  // Sync selected values to hidden text inputs for Django form submission
  function syncToInputs() {
    let dropVals = [];
    let passVals = [];

    if (tsDrop) {
      dropVals = tsDrop.getValue().map(v => parseInt(v, 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
    } else {
      dropVals = Array.from(dropSelect.selectedOptions).map(o => parseInt(o.value, 10)).sort((a, b) => a - b);
    }

    if (tsPass) {
      passVals = tsPass.getValue().map(v => parseInt(v, 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
    } else if (passSelect) {
      passVals = Array.from(passSelect.selectedOptions).map(o => parseInt(o.value, 10)).sort((a, b) => a - b);
    }

    droppedInput.value = dropVals.join(', ');
    if (passedInput) {
      passedInput.value = passVals.join(', ');
    }
  }

  // Update Passed Cores dropdown options based on current Dropped selections
  function updatePassedOptions() {
    if (!tsPass) return;
    const pointType = pointTypeSelect ? pointTypeSelect.value : 'drop';

    if (pointType === 'end') {
      tsPass.clear();
      tsPass.disable();
      const statusText = document.getElementById('pass-status-text');
      if (statusText) statusText.innerHTML = '<i class="mdi mdi-alert-circle-outline text-warning me-1"></i>End Point terminates the route — no outgoing passed cores.';
      syncToInputs();
      return;
    }

    tsPass.enable();
    const statusText = document.getElementById('pass-status-text');
    if (statusText) {
      if (pointType === 'start') {
        statusText.innerHTML = '<i class="mdi mdi-information-outline me-1"></i>Starting Point: all cores typically pass into the outgoing cable.';
      } else {
        statusText.innerHTML = '<i class="mdi mdi-information-outline me-1"></i>Cores dropped locally or terminated upstream cannot pass through.';
      }
    }

    const dropVals = (tsDrop ? tsDrop.getValue() : []).map(v => parseInt(v, 10));

    // Update each core's availability in Passed Cores
    coresData.forEach(cd => {
      const c = cd.core;
      const cStr = String(c);
      const isDroppedHere = (pointType !== 'start') && dropVals.includes(c);
      const isLocked = (pointType !== 'start') && cd.is_locked; // terminated at another drop point

      // If a core is currently selected in Passed Cores but is now dropped here or locked, remove it immediately!
      if (tsPass.items.includes(cStr) && (isDroppedHere || isLocked)) {
        tsPass.removeItem(cStr, true);
      }

      // Update option text & disabled status in TomSelect options registry
      const opt = tsPass.options[cStr];
      if (opt) {
        if (isLocked) {
          opt.disabled = true;
          opt.text = `Core ${c} (Circuit Complete - ${cd.terminated_at || 'Terminated'})`;
        } else if (isDroppedHere) {
          opt.disabled = true;
          opt.text = `Core ${c} (Dropped locally - cannot pass)`;
        } else {
          opt.disabled = false;
          opt.text = `Core ${c}`;
        }
        tsPass.updateOption(cStr, opt);
      }
    });

    tsPass.refreshOptions(false);
    syncToInputs();
  }

  // Smart Auto-Calculation of Passed Cores
  function calculatePassedCores() {
    if (!totalCores || !tsPass) return;
    const pointType = pointTypeSelect ? pointTypeSelect.value : 'drop';

    if (pointType === 'end') {
      tsPass.clear();
      tsPass.disable();
      syncToInputs();
      return;
    }

    const dropVals = (tsDrop ? tsDrop.getValue() : []).map(v => parseInt(v, 10));

    if (pointType === 'start') {
      // Starting Point: all cores pass into the cable
      const allCores = Array.from({ length: totalCores }, (_, i) => String(i + 1));
      tsPass.setValue(allCores);
    } else {
      // Intermediate Drop Point:
      // Passed Cores = all cores that are NOT locked upstream and NOT dropped at this point
      const toPass = [];
      coresData.forEach(cd => {
        if (!cd.is_locked && !dropVals.includes(cd.core)) {
          toPass.push(String(cd.core));
        }
      });
      tsPass.setValue(toPass);
    }

    updatePassedOptions();
    syncToInputs();
  }

  // Populate TomSelect options from API route data
  function populateSelectOptions(routeData) {
    coresData = routeData.cores_info || [];
    totalCores = routeData.total_cores || 0;
    const pointType = pointTypeSelect ? pointTypeSelect.value : 'drop';

    // Destroy existing instances if re-populating on route change
    if (tsDrop) { tsDrop.destroy(); tsDrop = null; }
    if (tsPass) { tsPass.destroy(); tsPass = null; }

    dropSelect.innerHTML = '';
    if (passSelect) passSelect.innerHTML = '';

    const initialDropped = parseCoreNumbers(droppedInput.value || (routeData.current_dropped || []).join(','));
    const initialPassed = parseCoreNumbers(passedInput ? passedInput.value || (routeData.current_passed || []).join(',') : '');

    // Setup options for Dropped Cores
    coresData.forEach(cd => {
      const c = cd.core;
      const isLocked = (pointType !== 'start') && cd.is_locked;

      const opt = document.createElement('option');
      opt.value = c;
      if (isLocked) {
        opt.disabled = true;
        opt.textContent = `Core ${c} (Circuit Complete - ${cd.terminated_at || 'Terminated'})`;
      } else {
        opt.textContent = `Core ${c}`;
        if (initialDropped.includes(c)) opt.selected = true;
      }
      dropSelect.appendChild(opt);
    });

    // Setup options for Passed Cores
    if (passSelect) {
      coresData.forEach(cd => {
        const c = cd.core;
        const isLocked = (pointType !== 'start') && cd.is_locked;

        const opt = document.createElement('option');
        opt.value = c;
        if (pointType === 'end') {
          opt.disabled = true;
          opt.textContent = `Core ${c} (End Point - No outgoing cores)`;
        } else if (isLocked) {
          opt.disabled = true;
          opt.textContent = `Core ${c} (Circuit Complete - ${cd.terminated_at || 'Terminated'})`;
        } else {
          opt.textContent = `Core ${c}`;
          if (initialPassed.includes(c)) opt.selected = true;
        }
        passSelect.appendChild(opt);
      });
    }

    // Initialize TomSelect on Dropped Cores
    if (typeof TomSelect !== 'undefined') {
      try {
        tsDrop = new TomSelect(dropSelect, {
          plugins: ['remove_button', 'clear_button'],
          persist: false,
          create: false,
          maxItems: null,
          placeholder: 'Select cores to drop...',
          hideSelected: true,
          closeAfterSelect: false,
          render: {
            option: function(data, escape) {
              if (data.disabled) {
                return `<div class="option disabled text-muted" style="pointer-events: none; opacity: 0.55; text-decoration: line-through; background: #f8f9fa;">
                  <i class="mdi mdi-lock-outline me-1"></i>${escape(data.text)}
                </div>`;
              }
              return `<div class="option">
                <i class="mdi mdi-ray-start me-1 text-success"></i>${escape(data.text)}
              </div>`;
            }
          },
          onItemAdd: function(value) {
            const valNum = parseInt(value, 10);
            const cd = coresData.find(x => x.core === valNum);
            // Protect against adding a locked core
            if (pointTypeSelect && pointTypeSelect.value !== 'start' && cd && cd.is_locked) {
              tsDrop.removeItem(value, true);
              return;
            }
            // If added to drop, ensure it is removed from pass
            if (tsPass && pointTypeSelect && pointTypeSelect.value !== 'start') {
              if (tsPass.items.includes(value)) {
                tsPass.removeItem(value, true);
              }
            }
            updatePassedOptions();
            syncToInputs();
          },
          onItemRemove: function() {
            updatePassedOptions();
            syncToInputs();
          },
          onChange: function() {
            syncToInputs();
          }
        });

        if (passSelect) {
          tsPass = new TomSelect(passSelect, {
            plugins: ['remove_button', 'clear_button'],
            persist: false,
            create: false,
            maxItems: null,
            placeholder: pointType === 'end' ? 'End point terminates route (no passed cores)' : 'Select cores to pass through...',
            hideSelected: true,
            closeAfterSelect: false,
            render: {
              option: function(data, escape) {
                if (data.disabled) {
                  return `<div class="option disabled text-muted" style="pointer-events: none; opacity: 0.55; text-decoration: line-through; background: #f8f9fa;">
                    <i class="mdi mdi-lock-outline me-1"></i>${escape(data.text)}
                  </div>`;
                }
                return `<div class="option">
                  <i class="mdi mdi-ray-start-end me-1 text-primary"></i>${escape(data.text)}
                </div>`;
              }
            },
            onItemAdd: function(value) {
              const valNum = parseInt(value, 10);
              const pType = pointTypeSelect ? pointTypeSelect.value : 'drop';
              const cd = coresData.find(x => x.core === valNum);
              const dropVals = (tsDrop ? tsDrop.getValue() : []).map(v => parseInt(v, 10));

              // In Intermediate Drop Point:
              // Cannot add if core is locked (circuit complete) OR already dropped locally
              if (pType !== 'start') {
                if ((cd && cd.is_locked) || dropVals.includes(valNum)) {
                  tsPass.removeItem(value, true);
                  return;
                }
              }
              syncToInputs();
            },
            onChange: function() {
              syncToInputs();
            }
          });

          if (pointType === 'end') {
            tsPass.disable();
          }
        }
      } catch (err) {
        console.warn("TomSelect initialization:", err);
      }
    } else {
      // Fallback if TomSelect is unavailable
      dropSelect.addEventListener('change', function() {
        updatePassedOptions();
        syncToInputs();
      });
      if (passSelect) {
        passSelect.addEventListener('change', syncToInputs);
      }
    }

    // If starting point and empty, pre-select all cores
    if (pointType === 'start' && !droppedInput.value && (!passedInput || !passedInput.value)) {
      const allCores = Array.from({ length: totalCores }, (_, i) => String(i + 1));
      if (tsDrop) tsDrop.setValue(allCores);
      if (tsPass) tsPass.setValue(allCores);
    } else if (pointType === 'drop' && droppedInput.value && (!passedInput || !passedInput.value)) {
      // Auto-fill pass if drop is set but pass is empty
      calculatePassedCores();
    }

    updatePassedOptions();
    syncToInputs();
  }

  // Fetch Route Data via API
  function loadRouteData(routeId) {
    if (!routeId) return;

    let url = `/plugins/fiber/api/route-cores/?route_id=${encodeURIComponent(routeId)}`;
    if (currentDpId) {
      url += `&drop_point_id=${encodeURIComponent(currentDpId)}`;
    }

    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(data => {
        populateSelectOptions(data);
      })
      .catch(err => {
        console.error("Error loading route cores:", err);
      });
  }

  // Auto-pass button listener
  if (passHelperBox) {
    const btnAutoPass = document.getElementById('btn-auto-pass');
    if (btnAutoPass) {
      btnAutoPass.addEventListener('click', function(e) {
        e.preventDefault();
        calculatePassedCores();
      });
    }
  }

  // Route select change listener
  routeSelect.addEventListener('change', function() {
    loadRouteData(this.value);
  });

  // Point type select change listener
  if (pointTypeSelect) {
    pointTypeSelect.addEventListener('change', function() {
      const pType = this.value;
      if (pType === 'start') {
        if (tsPass) tsPass.enable();
        if (totalCores && (!tsDrop || !tsDrop.getValue().length)) {
          const allCores = Array.from({ length: totalCores }, (_, i) => String(i + 1));
          if (tsDrop) tsDrop.setValue(allCores);
          if (tsPass) tsPass.setValue(allCores);
        }
      } else if (pType === 'end') {
        if (tsPass) {
          tsPass.clear();
          tsPass.disable();
        }
        if (passedInput) passedInput.value = '';
      } else {
        if (tsPass) tsPass.enable();
      }
      updatePassedOptions();
      syncToInputs();
    });
  }

  // Initial Data Load
  if (routeSelect.value) {
    loadRouteData(routeSelect.value);
  } else {
    const urlParams = new URLSearchParams(window.location.search);
    const preRoute = urlParams.get('fiber_route');
    if (preRoute) {
      routeSelect.value = preRoute;
      loadRouteData(preRoute);
    }
  }
}
</script>
{% endblock %}
